<!doctype html>
<html lang="es">
  <head>
        <meta charset="UTF-8" />

    <!-- Permite que el juego se adapte a celulares, tabletas y computadores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <title>Memorama Fauna Colombiana</title>

     <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <!-- Contenedor principal del juego -->
    <main class="game">

      <header class="game-header">
            <h1>🌿 Memorama Fauna Colombiana</h1>
            <p>Encuentra las parejas y aprende sobre nuestros animales</p>
      </header>

      <!-- Botones para seleccionar el nivel de dificultad -->
      <section class="levels" id="levels">
        <button data-pairs="6">Fácil</button>
        <button data-pairs="8" class="active">Medio</button>
        <button data-pairs="12">Difícil</button>
      </section>

      <!-- Barra que muestra las estadísticas del juego -->
      <section class="bar">
        <!-- Muestra el tiempo transcurrido -->
        <div class="stat">
          <small>Tiempo</small>
          <strong id="time">0:00</strong>
        </div>

        <!-- Muestra la cantidad de movimientos -->
        <div class="stat">
          <small>Movimientos</small>
          <strong id="moves">0</strong>
        </div>

        <!-- Muestra las parejas encontradas -->
        <div class="stat">
          <small>Parejas</small>
          <strong id="pairs">0/8</strong>
        </div>

        <!-- Botón para comenzar nuevamente -->
        <button class="btn" id="restart">↻ Reiniciar</button>

      </section>

      <!-- Aquí JavaScript genera dinámicamente las tarjetas -->
      <section class="board" id="board"></section>

      <!-- Información del animal -->
      <div class="fact" id="fact">
        💡 Al encontrar una pareja verás un dato curioso del animal.
      </section>

      <!-- récord del jugador -->
      <p class="best" id="best"></p>

    </main>

    <!-- Ventana emergente que aparece cuando se completa el juego -->
    <div class="modal" id="modal">
      <div class="modal-box">
        <h2>🎉 ¡Ganaste!</h2>

        <!-- JavaScript coloca aquí el resultado de la partida -->
        <p id="result"></p>

        <!-- Permite volver a jugar -->
        <button class="btn" id="again">Jugar otra vez</button>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
