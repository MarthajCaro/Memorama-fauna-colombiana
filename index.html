<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memorama Fauna Colombiana</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="game">
      <!-- Panel lateral: título, niveles y estadísticas -->
      <aside class="panel">
        <header class="game-header">
          <h1>🌿 Memorama Fauna Colombiana</h1>
          <p>Encuentra las parejas y aprende sobre nuestros animales</p>
        </header>

        <section class="levels" id="levels">
          <button data-pairs="6">Fácil</button>
          <button data-pairs="8" class="active">Medio</button>
          <button data-pairs="12">Difícil</button>
        </section>

        <section class="bar">
          <div class="stat">
            <small>Tiempo</small>
            <strong id="time">0:00</strong>
          </div>

          <div class="stat">
            <small>Movimientos</small>
            <strong id="moves">0</strong>
          </div>

          <div class="stat">
            <small>Parejas</small>
            <strong id="pairs">0/8</strong>
          </div>

          <button class="btn" id="restart">↻ Reiniciar</button>
        </section>

        <div class="fact" id="fact">
          💡 Al encontrar una pareja verás un dato curioso del animal.
        </div>

        <p class="best" id="best"></p>
      </aside>

      <!-- Zona del tablero -->
      <section class="board" id="board"></section>
    </main>

    <div class="modal" id="modal">
      <div class="modal-box">
        <h2>🎉 ¡Ganaste!</h2>
        <p id="result"></p>
        <button class="btn" id="again">Jugar otra vez</button>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
